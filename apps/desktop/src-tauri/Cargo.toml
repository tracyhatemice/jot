[package]
name = "jot-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "jot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.22"
